name: Publish Fayez Among Us
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - client/**
      - shared/**
      - server/**
      - index.html
      - public/**
      - package*.json
      - vite.config.js
      - .github/workflows/pages.yml
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: fayez-crew-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SERVER_URL: ${{ vars.FAYEZ_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the production relay
        run: |
          case "$VITE_SERVER_URL" in https://*) ;; *) echo "Set FAYEZ_SERVER_URL to the HTTPS Render origin."; exit 1;; esac
          expected="$(node --input-type=module -e "import {deckRevision} from './shared/deck.js'; console.log(deckRevision)")"
          ready=false
          for attempt in {1..15}; do
            if health="$(curl --max-time 12 --fail --silent --show-error "${VITE_SERVER_URL%/}/health")" &&
              printf '%s' "$health" | jq -e --arg deck "$expected" '.ok and .game == "Fayez Among Us" and .deck == $deck' >/dev/null; then
              ready=true
              break
            fi
            echo "Waiting for Render to serve deck $expected."
            sleep 10
          done
          if [ "$ready" != true ]; then
            echo "Render did not report deck $expected. Deploy the current main branch to Render and run this workflow again."
            exit 1
          fi
          curl --retry 3 --max-time 30 --fail --silent --show-error -D /tmp/fayez-cors -o /dev/null \
            -H 'Origin: https://fayezarcade.github.io' "${VITE_SERVER_URL%/}/socket.io/?EIO=4&transport=polling"
          grep -i '^access-control-allow-origin: https://fayezarcade.github.io' /tmp/fayez-cors
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
